name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Contract manifest covers the registered catalog
        run: python scripts/generate_tool_contract_manifest.py --check
      - name: Tests (credential-free)
        run: pytest -q
      - name: Mock-mode demo (end-to-end, offline)
        run: workiva-mcp-demo
